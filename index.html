<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Gateway - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(239, 68, 68, 0.08);
        }
        .glass-icon-btn {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.08);
            transition: all 0.2s ease-in-out;
        }
        .glass-icon-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.15);
        }
        .glass-modal {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-10">

    <!-- Top Navigation Bar -->
    <header class="max-w-md mx-auto pt-6 px-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <button onclick="openAdminModal()" class="w-10 h-10 glass-icon-btn rounded-xl flex items-center justify-center text-slate-700" title="Admin Panel">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <h1 class="text-xl font-bold text-slate-800">Dashboard</h1>
        </div>
        <div class="flex space-x-2">
            <button onclick="openAdminModal()" class="w-10 h-10 glass-icon-btn rounded-xl flex items-center justify-center text-slate-700" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button onclick="alert('Support: Contact admin@trustgateway.com')" class="w-10 h-10 glass-icon-btn rounded-xl flex items-center justify-center text-slate-700" title="Support">
                <i class="fa-solid fa-headset"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 mt-6">

        <!-- Total Balance Banner Card (Red Theme) -->
        <div class="bg-gradient-to-r from-red-600 to-rose-500 rounded-3xl p-6 text-white shadow-xl shadow-red-500/20 relative overflow-hidden mb-6">
            <!-- Background Decorative Overlay -->
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
            
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center space-x-2 text-red-100 text-xs font-semibold tracking-wider">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>TOTAL BALANCE</span>
                    </div>
                    <h2 id="display-balance" class="text-3xl font-black mt-2">₹24,580.00</h2>
                    
                    <!-- Month badge -->
                    <div class="inline-flex items-center bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs text-white mt-4 border border-white/20">
                        <i class="fa-solid fa-arrow-trend-up mr-1.5 text-xs"></i>
                        <span>₹1,200.00 this month</span>
                    </div>
                </div>

                <!-- Add Money Button -->
                <button onclick="addMoney()" class="flex flex-col items-center group">
                    <div class="w-14 h-14 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/30 shadow-lg transition duration-200">
                        <i class="fa-solid fa-plus text-2xl text-white"></i>
                    </div>
                    <span class="text-[11px] mt-1.5 text-red-100 font-medium">Add Money</span>
                </button>
            </div>
        </div>

        <!-- Quick Action Grid (8 Glass Buttons) -->
        <div class="grid grid-cols-4 gap-3 mb-6">
            
            <!-- Send -->
            <button onclick="alert('Send Money feature is ready.')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">Send</span>
            </button>

            <!-- Bulk Pay -->
            <button onclick="alert('Bulk Pay feature is ready.')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">Bulk Pay</span>
            </button>

            <!-- History -->
            <button onclick="alert('Recent Transactions: +₹1,200 (Client), -₹450 (Withdrawal)')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-right-left"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">History</span>
            </button>

            <!-- API Doc -->
            <button onclick="alert('API Documentation link opened.')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-code"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">API Doc</span>
            </button>

            <!-- Manuals -->
            <button onclick="alert('User Manuals opened.')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">Manuals</span>
            </button>

            <!-- Withdraw -->
            <button onclick="openWithdrawModal()" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">Withdraw</span>
            </button>

            <!-- Redeem -->
            <button onclick="alert('Redeem vouchers feature active.')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">Redeem</span>
            </button>

            <!-- Profile -->
            <button onclick="alert('User: John Doe | Verified Status: Active')" class="glass-icon-btn rounded-2xl p-3 flex flex-col items-center justify-center">
                <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2 text-lg shadow-inner">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="text-xs font-semibold text-slate-700">Profile</span>
            </button>

        </div>

        <!-- Activity Graph Card (Glass Box) -->
        <div class="glass-card rounded-3xl p-5 mb-6">
            <div class="flex justify-between items-center mb-4">
                <span class="font-bold text-sm tracking-wide text-slate-700 uppercase">ACTIVITY</span>
                
                <div class="flex items-center space-x-3 text-xs">
                    <div class="flex items-center space-x-1">
                        <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                        <span class="text-slate-500">Credit</span>
                    </div>
                    <div class="flex items-center space-x-1">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-300"></span>
                        <span class="text-slate-500">Debit</span>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="bg-slate-200/80 p-1 rounded-xl flex space-x-1 ml-2">
                        <button class="bg-red-600 text-white text-[10px] px-2.5 py-1 rounded-lg font-bold shadow-sm">7D</button>
                        <button class="text-slate-600 text-[10px] px-2.5 py-1 rounded-lg font-bold">30D</button>
                    </div>
                </div>
            </div>

            <!-- Simple Graphical Representation -->
            <div class="pt-4 pb-2 border-t border-slate-200/60">
                <div class="h-24 flex items-center justify-between relative px-2">
                    <!-- Flat Zero Line -->
                    <div class="absolute w-full h-[2px] bg-red-500/40 top-1/2 transform -translate-y-1/2"></div>
                    
                    <!-- Graph Dots -->
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                    <div class="w-2.5 h-2.5 bg-red-600 rounded-full z-10 shadow-md"></div>
                </div>
                
                <!-- Days Axis -->
                <div class="flex justify-between text-[11px] text-slate-400 font-medium px-1 mt-1">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>
            </div>
        </div>

    </main>

    <!-- WITHDRAW MODAL -->
    <div id="withdrawModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="glass-modal w-full max-w-sm p-6 rounded-3xl shadow-2xl relative border border-red-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-red-600"><i class="fa-solid fa-indian-rupee-sign mr-2"></i>Withdraw Funds</h3>
                <button onclick="closeWithdrawModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">&times;</button>
            </div>
            
            <form onsubmit="handleWithdraw(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Enter Amount (₹)</label>
                    <input type="number" id="withdraw-input" required placeholder="0.00" class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-red-500 font-bold">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Select Bank / UPI</label>
                    <select class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-red-500">
                        <option>HDFC Bank Account (*1234)</option>
                        <option>Google Pay UPI (user@oksbi)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-rose-500 hover:from-red-700 hover:to-rose-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-red-500/30 transition">Confirm Withdrawal</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="adminModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="glass-modal w-full max-w-sm p-6 rounded-3xl shadow-2xl relative border border-red-500/30">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-red-600"><i class="fa-solid fa-shield-halved mr-2"></i>Admin Control Panel</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Add/Deduct Balance (₹)</label>
                    <input type="number" id="admin-amount" placeholder="5000" class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-red-500 font-bold">
                    <button onclick="adminUpdateBalance()" class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl font-bold text-xs transition">Update Wallet Balance</button>
                </div>
                <hr class="border-slate-200">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Minimum Withdrawal Limit (₹)</label>
                    <input type="number" id="min-limit" value="100" class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:border-red-500 font-bold">
                    <button onclick="saveAdminLimit()" class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs transition">Save Limit Settings</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentBalance = 24580.00;
        let minWithdrawLimit = 100;

        function addMoney() {
            let amt = prompt("Enter amount to add (₹):", "1000");
            if (amt && !isNaN(amt)) {
                currentBalance += parseFloat(amt);
                updateBalanceDisplay();
                alert("Successfully added ₹" + amt + " to your wallet!");
            }
        }

        function openWithdrawModal() {
            document.getElementById('withdrawModal').classList.remove('hidden');
            document.getElementById('withdrawModal').classList.add('flex');
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').classList.remove('flex');
            document.getElementById('withdrawModal').classList.add('hidden');
        }

        function handleWithdraw(event) {
            event.preventDefault();
            let amt = parseFloat(document.getElementById('withdraw-input').value);
            
            if (amt < minWithdrawLimit) {
                alert("Error: Minimum withdrawal limit is ₹" + minWithdrawLimit);
                return;
            }
            if (amt > currentBalance) {
                alert("Error: Insufficient balance in wallet!");
                return;
            }

            currentBalance -= amt;
            updateBalanceDisplay();
            alert("Withdrawal request of ₹" + amt + " processed successfully!");
            closeWithdrawModal();
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminModal').classList.add('flex');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('flex');
            document.getElementById('adminModal').classList.add('hidden');
        }

        function adminUpdateBalance() {
            let val = parseFloat(document.getElementById('admin-amount').value);
            if (!isNaN(val)) {
                currentBalance += val;
                updateBalanceDisplay();
                alert("Admin successfully updated balance by ₹" + val);
                closeAdminModal();
            }
        }

        function saveAdminLimit() {
            let limit = parseFloat(document.getElementById('min-limit').value);
            if (!isNaN(limit)) {
                minWithdrawLimit = limit;
                alert("New minimum withdrawal limit saved: ₹" + minWithdrawLimit);
                closeAdminModal();
            }
        }

        function updateBalanceDisplay() {
            document.getElementById('display-balance').innerText = "₹" + currentBalance.toLocaleString('en-IN', {minimumFractionDigits: 2});
        }
    </script>
</body>
</html>
